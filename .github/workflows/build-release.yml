name: Build FilePreview Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-${{ matrix.arch }}
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and updater package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少 GitHub Actions Secret：TAURI_SIGNING_PRIVATE_KEY。请按 docs/应用内更新发布说明.md 完成配置。'
          }
          npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Smoke test Windows installer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw '未找到 Tauri NSIS 安装包' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'FilePreview-smoke'
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "FilePreview 安装失败，退出码：$($installerProcess.ExitCode)" }
          $application = Get-ChildItem -Path $installDirectory -Filter '*.exe' | Select-Object -First 1
          if (-not $application) { throw "未找到已安装的主程序：$installDirectory" }
          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw 'FilePreview 主程序启动后意外退出' }
          Stop-Process -Id $process.Id -Force

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw '未找到 Tauri NSIS 安装包' }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { throw "未找到 Tauri Windows 更新包签名：$signature" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName "release/FilePreview-Windows-${{ matrix.arch }}.exe"
          Copy-Item $signature "release/FilePreview-Windows-${{ matrix.arch }}.exe.sig"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: FilePreview-Windows-${{ matrix.arch }}
          path: release/FilePreview-Windows-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload Windows updater package
        uses: actions/upload-artifact@v5
        with:
          name: FilePreview-updater-Windows-${{ matrix.arch }}
          path: release/FilePreview-Windows-${{ matrix.arch }}.exe.sig
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: FilePreview-*
          path: release-assets
          merge-multiple: true

      - name: Create updater manifest
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          base_url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          windows_x64_sig=$(tr -d '\r\n' < release-assets/FilePreview-Windows-x64.exe.sig)
          windows_arm64_sig=$(tr -d '\r\n' < release-assets/FilePreview-Windows-arm64.exe.sig)
          cat > release-assets/latest.json <<EOF
          {
            "version": "${version}",
            "notes": "FilePreview ${RELEASE_TAG}，请查看 GitHub Release 了解本次更新内容。",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": { "signature": "${windows_x64_sig}", "url": "${base_url}/FilePreview-Windows-x64.exe" },
              "windows-aarch64": { "signature": "${windows_arm64_sig}", "url": "${base_url}/FilePreview-Windows-arm64.exe" }
            }
          }
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes_file" ]; then
            echo "缺少发布说明文件：$notes_file" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "FilePreview $RELEASE_TAG" --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "FilePreview $RELEASE_TAG" --notes-file "$notes_file"
          fi
